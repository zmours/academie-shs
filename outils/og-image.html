<!doctype html>
<!-- Source de public/og-image.jpg (aperçu affiché quand on partage le lien sur WhatsApp ou les
     réseaux). Après modification : `npm run images`. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/schibsted-grotesk/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/schibsted-grotesk/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-naskh-arabic/700.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .visuel { display: grid; grid-template-columns: 1fr 470px; gap: 24px; box-sizing: border-box; width: 1200px; height: 630px; padding: 28px; background: #EBEFE9; font-family: 'Schibsted Grotesk', sans-serif; color: #0E1E1A; }
  .texte { display: flex; flex-direction: column; justify-content: space-between; padding: 44px; border-radius: 30px; background: #F9FBF7; }
  .marque { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 900; letter-spacing: -.01em; }
  .sceau { display: grid; place-items: center; width: 54px; height: 54px; padding-bottom: 6px; box-sizing: border-box; border-radius: 16px; background: #10372F; color: #F0A830; font-family: 'Noto Naskh Arabic', serif; font-size: 30px; line-height: 1; }
  h1 { margin: 0; font-size: 62px; font-weight: 900; line-height: 1.02; letter-spacing: -.045em; }
  h1 span { background: linear-gradient(transparent 60%, #F0A830 60%, #F0A830 92%, transparent 92%); color: #10372F; }
  .pastilles { display: flex; gap: 10px; }
  .pastille { padding: 9px 15px; border-radius: 100px; background: #EBEFE9; font-size: 18px; font-weight: 700; white-space: nowrap; }
  .pastille--safran { background: #F0A830; }
  .photo { position: relative; overflow: hidden; border-radius: 30px; background: #10372F; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(10,30,25,.85)); }
  .photo b { position: absolute; z-index: 1; left: 28px; right: 28px; bottom: 26px; color: #F9FBF7; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; }
</style>
</head>
<body>
<div class="visuel">
  <div class="texte">
    <div class="marque"><span class="sceau">ع</span>Académie SHS</div>
    <h1>Études islamiques et sociales, <span>un cursus en trois ans.</span></h1>
    <div class="pastilles">
      <span class="pastille pastille--safran">Préinscriptions ouvertes</span>
      <span class="pastille">En direct</span>
      <span class="pastille">3 ans, pour adultes</span>
    </div>
  </div>
  <div class="photo">
    <img src="../public/photos/calligraphie.webp" alt="">
    <b>academie-shs.fr</b>
  </div>
</div>
</body>
</html>
