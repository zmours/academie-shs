<!doctype html>
<!-- Source de public/og-image.jpg (aperçu affiché quand on partage le lien sur WhatsApp ou les
     réseaux). Après modification : `npm run images`. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/readex-pro/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/readex-pro/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/readex-pro/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/amiri/400.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .visuel { position: relative; overflow: hidden; width: 1200px; height: 630px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(140deg, #0B2147 0%, #163D80 55%, #2A63B5 100%); color: #fff; font-family: 'Readex Pro', sans-serif; }
  .etoile { position: absolute; right: -150px; top: 20px; width: 620px; height: 620px; opacity: .1; }
  .haut, .bas { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .marque { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; }
  .signe { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; }
  .ouvert { padding: 10px 20px; border-radius: 100px; background: #F5B42A; color: #3A2600; font-size: 20px; font-weight: 700; }
  .milieu { position: relative; display: flex; flex-direction: column; gap: 14px; max-width: 860px; }
  .verset { font-family: 'Amiri', serif; font-size: 34px; color: rgba(255,255,255,.8); }
  h1 { margin: 0; font-size: 60px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
  h1 span { color: #F5B42A; }
  .pastilles { display: flex; gap: 10px; }
  .pastille { padding: 8px 18px; border-radius: 100px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); font-size: 19px; font-weight: 500; }
  .site { font-size: 24px; font-weight: 600; }
</style>
</head>
<body>
<div class="visuel">
  <svg class="etoile" viewBox="0 0 100 100" fill="none">
    <rect x="23" y="23" width="54" height="54" stroke="#fff" stroke-width="1.5"/>
    <rect x="23" y="23" width="54" height="54" stroke="#fff" stroke-width="1.5" transform="rotate(45 50 50)"/>
    <circle cx="50" cy="50" r="11" fill="#F5B42A" fill-opacity=".6"/>
  </svg>
  <div class="haut">
    <div class="marque">
      <span class="signe">
        <svg width="46" height="46" viewBox="0 0 100 100" fill="none">
          <rect x="23" y="23" width="54" height="54" rx="3" stroke="#fff" stroke-width="6"/>
          <rect x="23" y="23" width="54" height="54" rx="3" stroke="#fff" stroke-width="6" transform="rotate(45 50 50)"/>
          <circle cx="50" cy="50" r="11" fill="#F5B42A"/>
        </svg>
      </span>
      Académie SHS
    </div>
    <span class="ouvert">Préinscriptions ouvertes</span>
  </div>
  <div class="milieu">
    <div class="verset" dir="rtl" style="text-align: left">وَقُل رَّبِّ زِدْنِي عِلْمًا</div>
    <h1>Sciences islamiques et sciences humaines, <span>en trois langues</span>.</h1>
  </div>
  <div class="bas">
    <div class="pastilles">
      <span class="pastille">13 cours</span>
      <span class="pastille">En ligne, en direct</span>
      <span class="pastille">FR · <span style="font-family: 'Amiri', serif">العربية</span> · EN</span>
    </div>
    <span class="site">academie-shs.fr</span>
  </div>
</div>
</body>
</html>
