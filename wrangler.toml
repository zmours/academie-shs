# Configuration du Worker Cloudflare : les fichiers de `dist/` (construits par `npm run build`)
# sont servis tels quels, et le code de `worker/` ne répond qu'aux routes `/api/*`.
#
# Les secrets ne vont JAMAIS ici : en local dans `.dev.vars`, en production dans
# Cloudflare → Workers & Pages → academie-shs → Settings → Variables and Secrets.
#
# ⚠️ `name` doit être exactement le nom du Worker dans le tableau de bord Cloudflare.
name = "academie-shs"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Sans cette ligne, chaque `wrangler deploy` EFFACE les variables en texte clair saisies dans le
# tableau de bord (les secrets, eux, sont conservés).
keep_vars = true

# Variables non secrètes, versionnées ici plutôt que dans le tableau de bord.
[vars]
BREVO_LIST_ID = "4"   # liste « Préinscriptions 2026-2027 » du compte Brevo academie-shs

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true
